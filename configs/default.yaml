seed: 42
paths:
  raw_dir: ~/sepsis_s3            # PhysioNet 2019 ham .psv dosyaları (depoya konmaz)
  split_csv: splits/bolme.csv
  processed_dir: data/processed   # ön işlenmiş .npz (depoya konmaz)
  artifacts_dir: artifacts        # eğitilmiş modeller (depoya konmaz)
  results_dir: results
split:
  source_val_test_fraction: 0.30  # kaynak: %70 eğitim, kalan %30 yarı yarıya doğrulama / kaynak-içi test
  target_test_fraction: 0.70      # hedef: %30 adaptasyon (etiketsiz), %70 test
preprocess:
  use_iculos: true                # ablasyon için false
  clip: 5.0
lr:
  c_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  max_iter: 3000
  alarm_rate: 0.05                # doğrulama saatlerinin bu oranı alarm üretecek şekilde eşik
gru:
  hidden: 64
  layers: 1
  dropout: 0.2
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64              # hasta sayısı
  max_epochs: 30
  patience: 5                 # doğrulama AUPRC'si iyileşmezse durdur
  threads: 8
grud:                          # GRU-D tarzı model (önerilen) ve ablasyonu; gru ile aynı eğitim ayarları
  hidden: 64
  dropout: 0.2
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 30
  patience: 5
  noise_std: 0.0               # veri artırma: yalnızca eğitimde, değer sütunlarına Gauss gürültüsü (0 = kapalı)
  gap_limit: null              # örn. 0.05: eğitim-doğrulama AUPRC farkı bunu aşan epoch en iyi seçilmez (yalnızca doğrulamaya dayanır)
  threads: 8
gbm:                           # LightGBM (scripts/06 --model gbm | gbm_davranissiz); ayarlar 09_gbm_sweep.py ile YALNIZCA eğitim/doğrulamada seçildi
  lr: 0.05
  num_leaves: 4                 # tarama (2 yön, tohum 0, 8 ayar): kazanan yaprak=4, min_child=5000, lambda_l2=10 (iki yönde de aynı)
  max_depth: 3
  min_child_samples: 5000       # satırlar hasta içinde ilişkili olduğundan büyük tutulur (aşırı öğrenmeye karşı)
  feature_fraction: 0.5
  bagging_fraction: 0.5
  lambda_l2: 10.0
  max_bin: 63
  max_rounds: 300
  kontrol: 10                   # her 10 turda eğitim/doğrulama ölçülür (eğri noktası)
  patience: 5                   # kontrol noktası sayısı
  gap_limit: 0.05               # eğitim-doğrulama AUPRC farkı <= 0.05 olan noktalar arasından seç
  train_eval_rows: 0            # 0 = seçimde eğitim AUPRC'si TÜM eğitim satırlarında (alt örnek ölçütü 3/5 koşuda yanılttı)
  threads: 2
sk:                            # sklearn baseline'ları (lr, rf, et, mlp); ızgaralar models/sk_baselines.py'de, seçim yalnızca eğitim/doğrulama
  gap_limit: 0.05
  n_estimators: 100             # rf, et
  max_samples: 0.2              # rf, et: her ağaç eğitim satırlarının %20'si (hız + düzenlileştirme)
  lr_max_iter: 300
  mlp_max_iter: 10              # ilk denemede 30 epoch hastaları ezberledi (eğitim AUPRC 0,75+)
  threads: 2
train:
  device: cpu                  # cpu | cuda. Eski GRU sonuçları cpu ile üretildi; Colab'de colab.yaml'da cuda yapılır
report:
  alarm_rate: 0.05             # sınıflandırma raporu / karışıklık matrisi eşiği: doğrulama saatlerinin %5'i alarm
